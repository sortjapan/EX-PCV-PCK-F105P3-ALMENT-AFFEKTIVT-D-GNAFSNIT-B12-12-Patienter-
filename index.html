<!DOCTYPE html>
<html lang="da"><head><meta charset="utf-8"><title>Afdelingsoversigt</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style id="css">
*{box-sizing:border-box}
html,body{margin:0;background:#1f2030}
#app{font-size:12px;line-height:1.25;font-family:"Segoe UI",Arial,sans-serif;color:#e9e9f2;background:#1f2030;min-width:1500px;padding-bottom:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#262740;border-bottom:1px solid #3a3b5a}
.logo{color:#e0349b;font-weight:700;font-size:15px;width:260px}
h1{font-size:15px;margin:0;font-weight:600;text-align:center;flex:1}
.tools{width:260px;display:flex;gap:6px;justify-content:flex-end}
button{background:#3a3b5a;color:#fff;border:0;border-radius:4px;padding:5px 10px;cursor:pointer;font:inherit}
button:hover{background:#4a4c75}.pri{background:#2f7d4f}
table{border-collapse:collapse;width:100%}
th{font-size:.83em;color:#9fa0c0;text-align:left;padding:5px 6px;font-weight:600;white-space:nowrap}
td{padding:5px 6px;border-top:1px solid #34354f;vertical-align:middle}
tr.sep td{border-top:1px solid #5a5b80}
td.t{font-weight:600;min-width:40px}
td[data-c="3"],td[data-c="5"]{min-width:150px}
td[data-c="3"]{font-weight:700}
.dot{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;vertical-align:middle;margin-right:3px;background:transparent}
.dot.sq{border-radius:3px}
.g{background:#7fb04a}.y{background:#f6c93b}.r{background:#f2644f}.c{background:#2fd3c4}.p{background:#e8399b}
.badge{display:inline-block;min-width:16px;text-align:center;border-radius:3px;padding:0 4px;color:#222;font-weight:700;margin-right:5px}
.b-F{background:#a8d26a}.b-B{background:#f08b6a}.b-8{background:#e8399b}
[contenteditable]{outline:1px dashed #6a6c9a;min-width:20px;display:inline-block;padding:0 2px}
.edit .dot{outline:1px dashed #6a6c9a;cursor:pointer}
.x{color:#f2644f;cursor:pointer;font-weight:700;padding:0 6px}
.hint{color:#8082a8;font-size:.85em;padding:6px 14px}
#bar{display:none;gap:14px;align-items:center;padding:6px 14px;background:#2d2e4b;border-bottom:1px solid #3a3b5a}
.edit #bar{display:flex}
#bar label{color:#9fa0c0}
select,input[type=number],input[type=date]{background:#1f2030;color:#fff;border:1px solid #5a5b80;border-radius:4px;padding:3px 6px;font:inherit;color-scheme:dark}
input[type=number]{width:60px}
input[type=date]{padding:1px 4px}
.clr{color:#9fa0c0;cursor:pointer;padding:0 4px}
</style></head><body>
<div id="app">
 <header><div class="logo">Epic ▾</div><h1 id="title"></h1>
  <div class="tools noshot" id="tools"><button id="edit">✎ Rediger</button></div></header>
 <div id="bar" class="noshot"></div>
 <table><thead id="head"></thead><tbody id="body"></tbody></table>
 <div class="hint noshot">Alt+P gemmer hele siden som PNG · Alt+F fuldskærm</div>
</div>
<script>
const COLS=[['St.','t'],['Patient','t'],['Akt.diag','t'],['Husk EM fritekst','t'],['Førs.udk','t'],['Team (EM) fritekst','t'],['Beh.pl.rev','t'],['ECT','t'],['SRV','d'],['OBS N','t'],['SVC','d'],['KP/UA','dq'],['LAB','d'],['Påk/ISV','dd'],['Krisepl.','t'],['Ord/Udg/Retur','b'],['Plejepers.','t']];
const CYCLE=['','c','g','y','r','p'];
const R=(...a)=>a;
const DEFAULT = {
  title: 'EM RHP PCK C105D3 ALMENT AFFEKTIVT DØGNAFSNIT D3',
  rows: [
    R('01','Patient 01','Bipolar typ…','Stg 15.10 F2','29-10-26','AAL','21 dag(e)','ECT','g','Alm','','y','','c,c','12-10…','B Tilstede','Plejer A'),
    R('02','Patient 02','Skizoaffekt…','Stg 15.10 F2','14-10-26','KAG','-24 dag(e)','','g','Alm*','','','','c,c','26-07…','F Tilstede','Plejer B'),
    R('03','Patient 03','Bipolar typ…','Stg 15.10 GG F2','','','5 dag(e)','ECT','g','Alm','','r','','p,p','21-02…','8 20:00','Plejer B, C'),
    R('04','Patient 04','Angstlidel…','Stg 14.10 9:30 med far F3','28-10-26','henvist angstpakke','7 dag(e)','','g','Alm','','','','c,c','12-10…','F Tilstede','Plejer D'),
    R('05','Patient 05','Periodisk…','Stg 13.10 Fase 2','04-11-26','','-4 dag(e)','','g','Alm','','r','','c,c','07-10…','B Tilstede','Plejer C'),
    R('06','Patient 06','Bipolar typ…','Stg 19.10','27-10-26','FACT','5 dag(e)','','g','Alm','','','','p,p','09-10…','F','Plejer E, A'),
    R('08','Patient 08','Skizoaffekt…','Stg 19.10 udsk kl 10 med FA… F3','19-10-26','FACT','-6 dag(e)','','g','Alm','','y','','c,c','21-09…','F Tilstede','Plejer F'),
    R('09','Patient 09','Generalise…','Stg 13.10 med Mads','30-10-26','Alventer FACT','15 dag(e)','','g','Alm','','y','','c,c','','F Tilstede','Plejer G'),
    R('10','Patient 10','Anden iek…','Stg 15.10 GG F2…','','OPUS','0 dag(e)','','g','Alm','c','r','','c,c','11-10…','B Udgang 15:45','Plejer D'),
    R('12','Patient 12','Bipolar typ…','Stg 13.10 F2','22-10-26','FACT','-2 dag(e)','','g','Alm','','','','c,c','','F Tilstede','Plejer D'),
    R('13','Patient 13','Posttraum…','Stg 14.10 F2','29-10-26','Skal henvises FACT mhp DAT','43 dag(e)','','g','Alm','','','','c,c','','F Tilstede','Plejer D'),
    R('14','Patient 14','Blandet an…','Stg 16.10 F2','20-10-26','Henvist Angstpakke','11 dag(e)','','g','Alm','','','','c,c','03-10…','F Tilstede','Plejer A'),
    R('15','Patient 15','Depressiv…','Netværksmø. 19/10 10:45 F2…','16-07-26','Afv. svar vedr. genop.','-78 dag(e)','','g','Alm','y','','','c,c','','F Tilstede','Plejer A, H'),
    R('Gang1','','','','','','','','','','','','','','','',''),
    R('Gang2','','','','','','','','','','','','','','','',''),
    R('Gang3','','','','','','','','','','','','','','','','')
  ]
};
// ---- OPSÆTNING ----
const CLOUD='https://ex-pcv-pck-default-rtdb.europe-west1.firebasedatabase.app/';      // fx 'https://mitprojekt-default-rtdb.europe-west1.firebasedatabase.app' (tom = ingen online-lager)
const EDIT_PASS='';  // valgfri adgangskode til Rediger-knappen (kun beskyttelse mod uheld, ikke rigtig sikkerhed)
let MODE='static',last='';
const DATECOLS=[4,14];
const FONTS=['Segoe UI','Arial','Helvetica','Verdana','Tahoma','Trebuchet MS','Calibri','Georgia','Times New Roman','Courier New','system-ui','monospace'];
const SEP_AFTER=[2,5,8,9,12,13]; // tykkere skillelinjer efter disse rækkeindex
let S=null, editing=false, pass='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toIso=v=>{v=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{2}|\d{4})$/);if(!m)return '';return (m[3].length==2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')};
const fmtDate=v=>v?v.slice(8,10)+'-'+v.slice(5,7)+'-'+v.slice(2,4):'–';
function normalize(d){d.font=d.font||'Segoe UI';d.size=+d.size||12;d.title=d.title||'';
  d.rows=(d.rows||[]).map(r=>{r=Array.from({length:COLS.length},(_,i)=>r[i]??'');DATECOLS.forEach(c=>r[c]=toIso(r[c]));return r});return d}
function applyStyle(){const g=['system-ui','monospace','sans-serif','serif'].includes(S.font);
  $('#app').style.fontFamily=(g?S.font:`"${S.font}"`)+',Arial,sans-serif';$('#app').style.fontSize=S.size+'px'}
async function getJson(u){const r=await fetch(u);if(!r.ok)throw 0;return r.json()}
async function load(){
  let d;MODE='static';
  if(CLOUD){try{const r=await fetch(CLOUD.replace(/\/$/,'')+'/board.json');if(!r.ok)throw 0;const j=await r.json();MODE='cloud';if(j&&j.json){last=j.json;d=JSON.parse(j.json)}}catch{}}
  if(MODE!='cloud'){
    try{d=await getJson('api/data');MODE='server'}catch{try{const l=localStorage.getItem('board');if(l)d=JSON.parse(l)}catch{}}
  }
  if(!d)try{d=await getJson('data.json')}catch{}
  if(!d)d=DEFAULT;
  S=normalize(d);render();
  document.querySelector('.hint').firstChild.textContent=({static:'Statisk tilstand: ændringer gemmes kun i denne browser · ',cloud:'Online · '}[MODE]||'')+'Alt+P gemmer hele siden som PNG · Alt+F fuldskærm'}
// live-opdatering fra online-lager (springes over mens der redigeres)
setInterval(async()=>{if(MODE!='cloud'||editing)return;
  try{const r=await fetch(CLOUD.replace(/\/$/,'')+'/board.json');const j=await r.json();
    if(j&&j.json&&j.json!==last){last=j.json;S=normalize(JSON.parse(j.json));render()}}catch{}},3000);
function render(){
  applyStyle();
  $('#app').classList.toggle('edit',editing);
  $('#title').innerHTML=(editing?`<span contenteditable="true" data-title>${esc(S.title)}</span>`:esc(S.title))+` (${S.rows.filter(r=>r[1]).length} Patienter)`;
  $('#head').innerHTML='<tr>'+COLS.map(c=>`<th>${c[0]}</th>`).join('')+(editing?'<th></th>':'')+'</tr>';
  $('#body').innerHTML=S.rows.map((r,i)=>{
    const tds=COLS.map(([n,t],c)=>{
      const v=r[c]??'';let h;
      if(DATECOLS.includes(c))h=editing?`<input type="date" value="${esc(v)}" data-r="${i}" data-c="${c}"><span class="clr" data-clr="${i},${c}">×</span>`:fmtDate(v);
      else if(t=='t')h=editing?`<span contenteditable="true" data-r="${i}" data-c="${c}">${esc(v)}</span>`:(esc(v)||'–');
      else if(t=='d'||t=='dq')h=`<span data-r="${i}" data-c="${c}" data-k="d">${dot(v,t=='dq'?'sq':'')}</span>`;
      else if(t=='dd')h=`<span>${(v||',').split(',').map((x,k)=>`<span data-r="${i}" data-c="${c}" data-k="dd" data-i="${k}">${dot(x,'')}</span>`).join('')}</span>`;
      else{const L=(v[0]||'');h=editing?`<span contenteditable="true" data-r="${i}" data-c="${c}">${esc(v)}</span>`:(v?`<span class="badge b-${esc(L)}">${esc(L)}</span>${esc(v.slice(1).trim())}`:'')}
      return `<td data-c="${c}" class="${c==0?'t':''}">${h}</td>`}).join('');
    return `<tr class="${SEP_AFTER.includes(i-1)?'sep':''}">${tds}${editing?`<td><span class="x" data-del="${i}">×</span></td>`:''}</tr>`}).join('');
}
$('#body').addEventListener('input',e=>{const t=e.target;if(t.dataset.r!=null)S.rows[t.dataset.r][t.dataset.c]=t.textContent});
$('#body').addEventListener('click',e=>{
  if(!editing)return;
  const cl=e.target.closest('[data-clr]');if(cl){const [i,c]=cl.dataset.clr.split(',');S.rows[i][c]='';return render()}
  if(e.target.type=='date'){try{e.target.showPicker()}catch{}}
  const x=e.target.closest('[data-del]');if(x){S.rows.splice(+x.dataset.del,1);return render()}
  const t=e.target.closest('[data-k]');if(!t)return;
  const r=S.rows[t.dataset.r],c=t.dataset.c,nx=v=>CYCLE[(CYCLE.indexOf(v)+1)%CYCLE.length];
  if(t.dataset.k=='d')r[c]=nx(r[c]||'');
  else{const p=(r[c]||',').split(',');p[+t.dataset.i]=nx(p[+t.dataset.i]||'');r[c]=p.join(',')}
  render()});
$('#body').addEventListener('change',e=>{const t=e.target;if(t.type=='date')S.rows[t.dataset.r][t.dataset.c]=t.value});
// ren tekst ved copy/paste/drop, ingen linjeskift
document.addEventListener('paste',e=>{if(!e.target.isContentEditable)return;e.preventDefault();
  document.execCommand('insertText',false,(e.clipboardData.getData('text/plain')||'').replace(/\s*[\r\n]+\s*/g,' '))});
document.addEventListener('copy',e=>{const t=getSelection().toString();if(!t)return;e.preventDefault();e.clipboardData.setData('text/plain',t)});
document.addEventListener('cut',e=>{if(!e.target.isContentEditable)return;const t=getSelection().toString();e.preventDefault();e.clipboardData.setData('text/plain',t);document.execCommand('delete')});
document.addEventListener('drop',e=>{if(e.target.isContentEditable)e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});
document.addEventListener('input',e=>{if(e.target.dataset.title!=null)S.title=e.target.textContent});
const FS='<button id="fs" title="Fuldskærm (Alt+F)">⛶</button>';
function tools(){
  $('#tools').innerHTML=(editing?'<button id="add">+ Række</button><button id="save" class="pri">Gem</button><button id="cancel">Annuller</button>':'<button id="edit">✎ Rediger</button>')+FS;
  $('#fs').onclick=toggleFs;
  $('#bar').innerHTML=editing?`<label>Skrifttype <select id="ff">${FONTS.map(f=>`<option${f==S?.font?' selected':''}>${f}</option>`).join('')}</select></label>
   <label>Størrelse <input type="number" id="sz" min="8" max="40" value="${S?.size||12}"> px</label>
   <button id="exp">⭳ Eksportér JSON</button><button id="imp">⭱ Importér JSON</button><input type="file" id="file" accept=".json,application/json" hidden>
   ${MODE=='static'?'<button id="reset">Slet lokale ændringer</button><span style="color:#8082a8">Gem = kun denne browser. Eksportér JSON og læg filen i repoet som <b>data.json</b> for at opdatere for alle.</span>':MODE=='cloud'?'<span style="color:#8082a8">Gem = online. Alle åbne skærme opdateres inden for få sekunder.</span>':'<span style="color:#8082a8">Import erstatter visningen — tryk Gem for at gemme på serveren</span>'}`:'';
  if(editing){
    $('#add').onclick=()=>{S.rows.push(Array(COLS.length).fill(''));render()};$('#save').onclick=save;
    $('#cancel').onclick=async()=>{editing=false;tools();await load()};
    $('#ff').onchange=e=>{S.font=e.target.value;applyStyle()};
    $('#sz').oninput=e=>{S.size=Math.min(40,Math.max(8,+e.target.value||12));applyStyle()};
    $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
      a.download='afdeling-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
    if(MODE=='static')$('#reset').onclick=async()=>{if(confirm('Slet lokale ændringer og vis data.json / standarddata?')){localStorage.removeItem('board');editing=false;await load();tools()}};
    $('#imp').onclick=()=>$('#file').click();
    $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const d=JSON.parse(await f.text());if(!Array.isArray(d.rows))throw 0;S=normalize(d);tools();render()}
      catch{alert('Ugyldig JSON-fil (mangler "rows").')}}
  } else $('#edit').onclick=startEdit}
function toggleFs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
document.addEventListener('fullscreenchange',()=>{document.querySelector('.hint').style.display=document.fullscreenElement?'none':''});
async function startEdit(){
  if(MODE!='server'){if(EDIT_PASS&&prompt('Adgangskode:')!==EDIT_PASS)return alert('Forkert adgangskode');editing=true;tools();render();return}
  let r=await fetch('/api/auth',{headers:{'x-pass':pass}});
  if(r.status==401){pass=prompt('Adgangskode:')||'';r=await fetch('/api/auth',{headers:{'x-pass':pass}});if(r.status==401)return alert('Forkert adgangskode')}
  editing=true;tools();render()}
async function save(){
  if(MODE=='cloud'){const str=JSON.stringify(S);
    try{const r=await fetch(CLOUD.replace(/\/$/,'')+'/board.json',{method:'PUT',body:JSON.stringify({json:str})});if(!r.ok)throw 0;last=str}
    catch{return alert('Kunne ikke gemme online')}
    editing=false;tools();render();return}
  if(MODE=='static'){try{localStorage.setItem('board',JSON.stringify(S))}catch{return alert('Kunne ikke gemme i browseren')}editing=false;tools();render();return}
  const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json','x-pass':pass},body:JSON.stringify(S)});
  if(!r.ok)return alert('Kunne ikke gemme');editing=false;tools();render()}
// ---- PNG af hele siden (ingen eksterne biblioteker) ----
async function savePng(){
  const app=$('#app'),w=app.scrollWidth,h=app.scrollHeight,sc=2;
  const clone=app.cloneNode(true);clone.querySelectorAll('.noshot').forEach(n=>n.remove());
  clone.style.width=w+'px';
  const xml=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${$('#css').textContent}</style>${xml}</div></foreignObject></svg>`;
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await img.decode();
  const cv=document.createElement('canvas');cv.width=w*sc;cv.height=h*sc;
  const g=cv.getContext('2d');g.scale(sc,sc);g.drawImage(img,0,0);
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='afdeling-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.png';a.click()},'image/png')}
document.addEventListener('keydown',e=>{if(e.altKey&&e.code=='KeyP'){e.preventDefault();savePng()}if(e.altKey&&e.code=='KeyF'){e.preventDefault();toggleFs()}});
load().then(tools);
</script></body></html>
